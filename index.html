<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Primary Page Metadata -->
    <title>Taaa.shop | Multi-Tenant WhatsApp Social Commerce Catalog</title>
    <meta name="title" content="Taaa.shop | Multi-Tenant WhatsApp Social Commerce Catalog" />
    <meta name="description" content="Taaa.shop is the multi-tenant social commerce catalog built for WhatsApp & Instagram merchants. Get your branded digital store (yourstore.taaa.com.ng) with fast Item UID lookup (#TA-ITEM), 1-click pre-filled WhatsApp ordering, automated receipts, QR code status graphics, and zero customer account login needed." />

    <meta name="author" content="Taaa.shop" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & App Icons (PWA manifest is dynamically loaded on landing page only) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme & Mobile Web App Settings -->
    <meta name="theme-color" content="#090d16" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Taaa.shop" />
    <meta name="application-name" content="Taaa.shop" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taaa.shop" />
    <meta property="og:title" content="Taaa.shop | Multi-Tenant WhatsApp Social Commerce Catalog" />

    <meta property="og:image" content="https://taaa.com.ng/og-logo.png" />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
