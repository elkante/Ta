<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="130" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="10"/>

  <!-- "Táaaa" Logo Letters — T in white, áaaa in amber -->
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="175" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-6">T</text>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="110" font-weight="900" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="-4">áaaa</text>

  <!-- WhatsApp Commerce Indicator Beacon -->
  <circle cx="415" cy="115" r="32" fill="#25D366"/>
  <circle cx="415" cy="115" r="18" fill="#ffffff" opacity="0.3"/>
</svg>
